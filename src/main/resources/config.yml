messages:
  join: '&6Welcome to The Pit, &e{player}&6!'

# Current Pit map: Abyss, Genesis, Seasons, Elements or Castle (the rebuilt map in run/world is Seasons)
map: 'Seasons'

# How damage increases/reductions stack (also /pit damage <additive|multiplicative>)
#   additive:       1 + sum(increases) - sum(reductions)   (Solitude -60% + Funky -40% = -100%, Billionaire III +100% cancels it)
#   multiplicative: product of (1 + increase) and (1 - reduction)  (reverse-engineered from a recording: 1.10 x 1.05 = 1.155)
damage:
  stacking: 'additive'

# Experimental Pit sidebar
scoreboard:
  enabled: true
  title: '&f&lTHE &e&lHYPIXEL PIT'
  # Server name shown next to the date
  server: 'M1A'
  footer: '&ewww.hypixel.net'

# Spawn. points are "x,y,z,yaw" (Hypixel Pit respawn points from the recording).
# If points is empty, the world spawn is used.
spawn:
  world: ''
  teleport-on-join: true
  points:
  - '9.5,114,0.5,90'
  - '11.5,114.6,-11.25,-135'
  - '7,114,7,135'
  # Players inside this area cannot attack or be attacked
  protection:
    enabled: true
    center-x: 0.5
    center-z: 0.5
    radius: 25
    min-y: 105

# Floating text on the map: "x,y,z|text" (& color codes). Defaults are the Hypixel positions from the recording.
holograms:
  enabled: true
  lines:
