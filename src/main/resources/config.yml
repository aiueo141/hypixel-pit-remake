# Text above and below the tab list
tab:
  header: '&bYou are playing on &e&lMC.HYPIXEL.NET'
  footer: '&aRanks, Boosters & MORE! &c&lSTORE.HYPIXEL.NET'

# Backups of the worlds (terrain) and plugins/Pit into <server>/backups (also /pit backup). 0 = no automatic backups
backup:
  interval-minutes: 60
  keep: 10
