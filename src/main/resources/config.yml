  - '-13.5,116.25,0.5|&7Item Enchants'
  - '-11.5,115.28,5.5|&5&lENDER CHEST'
  - '-11.5,115.00,5.5|&7Store items forever'
  - '-6.5,116.91,11.5|&e&lUNLOCKED FEATURES'
  - '-6.5,116.50,11.5|&7[&71&7] &b/respawn'
  - '-6.5,116.19,11.5|&7[&75&7] &b/pitchat'
  - '-6.5,115.88,11.5|&7[&910&7] &bUpgrades'
  - '-6.5,115.59,11.5|&7[&915&7] &bEnder Chest'
  - '-6.5,115.28,11.5|&7[&230&7] &bContracts'
  - '-6.5,115.00,11.5|&7[&e50&7] &bStats'
